spring.application.name=web_crawler
server.port=${PORT:8081}

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Crawler & Caching Properties
crawler.cache.ttl-seconds=300
crawler.cache.enabled=true
crawler.rate-limit.requests-per-second=${RATE_LIMIT_RPS:5}
crawler.lock.ttl-seconds=${LOCK_TTL_SECONDS:5}
crawler.lock.wait-timeout-ms=${LOCK_WAIT_TIMEOUT_MS:3000}
crawler.background.interval-seconds=${BACKGROUND_INTERVAL_SECONDS:300}
crawler.background.enabled=false

# Upstream Mock Retailer URLs
crawler.sources.amazon.url=${AMAZON_MOCK_URL:http://localhost:8085}
crawler.sources.amazon.enabled=${AMAZON_ENABLED:true}

crawler.sources.flipkart.url=${FLIPKART_MOCK_URL:http://localhost:8086}
crawler.sources.flipkart.enabled=${FLIPKART_ENABLED:true}

crawler.sources.meesho.url=${MEESHO_MOCK_URL:http://localhost:8087}
crawler.sources.meesho.enabled=${MEESHO_ENABLED:true}

crawler.sources.instamart.url=${INSTAMART_MOCK_URL:http://localhost:8088}
crawler.sources.instamart.enabled=${INSTAMART_ENABLED:true}

# Authorized Public Live Source (Open Food Facts)
crawler.sources.openfoodfacts.url=${OPENFOODFACTS_URL:https://world.openfoodfacts.org}
crawler.sources.openfoodfacts.enabled=${OPENFOODFACTS_ENABLED:true}

# Actuator & Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging
logging.level.com.example.web_crawler=INFO
logging.level.org.springframework.data.redis=INFO
