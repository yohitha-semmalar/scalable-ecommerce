spring.application.name=cart-service
server.port=${SERVER_PORT:8083}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:ecommerce}
app.jwt.secret=${JWT_SECRET_BASE64}
app.product.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
app.limit.requests=${RATE_LIMIT_REQUESTS:60}
app.limit.seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
