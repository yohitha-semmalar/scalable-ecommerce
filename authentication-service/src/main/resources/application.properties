server.port=${SERVER_PORT:8082}
spring.application.name=authentication-service

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:ecommerce}
spring.data.mongodb.auto-index-creation=true

# Generate a secure Base64 key; see README. Do not commit the real key.
app.jwt.secret=${JWT_SECRET_BASE64}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

server.error.include-message=always
server.error.include-binding-errors=always
